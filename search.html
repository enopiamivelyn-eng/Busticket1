<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Bus Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <img src="assets/images/mylogo.png" alt="Bus Ticketing Logo" style="width: 50px; height: 50px; object-fit: contain;">
                </div>
                <span class="logo-text">Bus Ticketing</span>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="home.html">Home</a></li>
                    <li class="nav-item"><a href="#about">About Us</a></li>
                    <li class="nav-item"><a href="#bookings">My Bookings</a></li>
                    <li class="nav-item"><a href="ticket.html">My Ticket</a></li>
                    <li class="nav-item"><a href="#reservation">My Reservation</a></li>
                    <li class="nav-item"><a href="#profile">Profile</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="user-avatar"></div>
                <span class="username">Username</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="back-btn" onclick="window.history.back()">←</button>
                    <span class="page-title">Hello + Username!</span>
                </div>
                <div class="header-right">
                    <span class="search-icon">🔍</span>
                    <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="search-form">
                    <form id="searchForm" onsubmit="handleSearch(event)">
                        <!-- From and To -->
                        <div class="input-group">
                            <label for="from">From</label>
                            <input type="text" id="from" value="Cebu" required>
                        </div>

                        <div class="input-group">
                            <label for="to">To</label>
                            <input type="text" id="to" value="Oslob" required>
                        </div>

                        <!-- Date and Time -->
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="departureDate">Departure Date</label>
                                <input type="date" id="departureDate" value="2026-09-05" required>
                            </div>

                            <div class="input-group">
                                <label for="departureTime">Time</label>
                                <select id="departureTime" required>
                                    <option value="8:00 AM" selected>8:00 AM</option>
                                    <option value="9:00 AM">9:00 AM</option>
                                    <option value="10:00 AM">10:00 AM</option>
                                    <option value="11:00 AM">11:00 AM</option>
                                    <option value="12:00 PM">12:00 PM</option>
                                    <option value="1:00 PM">1:00 PM</option>
                                    <option value="2:00 PM">2:00 PM</option>
                                    <option value="3:00 PM">3:00 PM</option>
                                    <option value="4:00 PM">4:00 PM</option>
                                    <option value="5:00 PM">5:00 PM</option>
                                </select>
                            </div>
                        </div>

                        <!-- Passenger and Seat -->
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="passengers">Passenger</label>
                                <select id="passengers" required>
                                    <option value="1" selected>1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label for="seatNo">Seat No.</label>
                                <select id="seatNo" required>
                                    <option value="15" selected>15</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="16">16</option>
                                    <option value="17">17</option>
                                    <option value="18">18</option>
                                    <option value="19">19</option>
                                    <option value="20">20</option>
                                </select>
                            </div>
                        </div>

                        <div class="center-content" style="margin-top: 30px;">
                            <button type="submit" class="btn-primary">Search</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        function handleSearch(event) {
            event.preventDefault();
            
            // Get form values
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const date = document.getElementById('departureDate').value;
            const time = document.getElementById('departureTime').value;
            const passengers = document.getElementById('passengers').value;
            const seatNo = document.getElementById('seatNo').value;
            
            // Store in sessionStorage
            sessionStorage.setItem('searchData', JSON.stringify({
                from, to, date, time, passengers, seatNo
            }));
            
            // Redirect to search results
            window.location.href = 'search-results.html';
        }
    </script>
</body>
</html>
