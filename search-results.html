<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Bus Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <img src="assets/images/mylogo.png" alt="Bus Ticketing Logo" style="width: 50px; height: 50px; object-fit: contain;">
                </div>
                <span class="logo-text">Bus Ticketing</span>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="home.html">Home</a></li>
                    <li class="nav-item"><a href="#about">About Us</a></li>
                    <li class="nav-item"><a href="my-bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a href="#book-details">Book Details</a></li>
                    <li class="nav-item"><a href="#reservation">My Reservation</a></li>
                    <li class="nav-item"><a href="#profile">Profile</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="user-avatar"></div>
                <span class="username">Username</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="back-btn" onclick="window.history.back()">←</button>
                    <span class="page-title">Hello + Username!</span>
                </div>
                <div class="header-right">
                    <span class="search-icon">🔍</span>
                    <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Bus</h2>
                    
                    <div class="book-details">
                        <div class="bus-image-small"></div>
                        
                        <div class="booking-info">
                            <p id="busDate" style="margin-bottom: 10px; font-size: 16px; color: #6b7280;">September 5, 2026 | 8:00AM</p>
                            <div class="route-info">
                                <span id="busFrom" style="font-weight: 600;">Cebu</span>
                                <span style="margin: 0 10px;">→</span>
                                <span id="busTo" style="font-weight: 600;">Oslob</span>
                            </div>
                            <p id="busSeat" style="margin-top: 10px; color: #6b7280;">Seat: 15</p>
                            <p id="busPrice" style="font-size: 20px; font-weight: 600; margin-top: 10px;">₱200</p>
                        </div>
                    </div>

                    <div class="center-content" style="margin-top: 30px;">
                        <button class="btn-primary" onclick="window.location.href='passenger-details.html'">Book Now</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Load search data from sessionStorage
        window.addEventListener('DOMContentLoaded', function() {
            const searchData = JSON.parse(sessionStorage.getItem('searchData') || '{}');
            
            if (searchData.from) {
                document.getElementById('busFrom').textContent = searchData.from;
            }
            if (searchData.to) {
                document.getElementById('busTo').textContent = searchData.to;
            }
            if (searchData.date && searchData.time) {
                const dateObj = new Date(searchData.date);
                const formattedDate = dateObj.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                document.getElementById('busDate').textContent = `${formattedDate} | ${searchData.time}`;
            }
            if (searchData.seatNo) {
                document.getElementById('busSeat').textContent = `Seat: ${searchData.seatNo}`;
            }
            
            // Store booking data for next page
            sessionStorage.setItem('bookingData', JSON.stringify({
                busName: 'JoyBus',
                from: searchData.from || 'Cebu',
                to: searchData.to || 'Oslob',
                date: searchData.date || '2026-09-05',
                time: searchData.time || '8:00 AM',
                seat: searchData.seatNo || '15',
                price: '200'
            }));
        });
    </script>
</body>
</html>
