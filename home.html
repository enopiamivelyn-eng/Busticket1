<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Bus Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <img src="assets/images/mylogo.png" alt="Bus Ticketing Logo" style="width: 50px; height: 50px; object-fit: contain;">
                </div>
                <span class="logo-text">Bus Ticketing</span>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="home.html" class="active">Home</a></li>
                    <li class="nav-item"><a href="#about">About Us</a></li>
                    <li class="nav-item"><a href="my-bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a href="#book-details">Book Details</a></li>
                    <li class="nav-item"><a href="#reservation">My Reservation</a></li>
                    <li class="nav-item"><a href="#profile">Profile</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="user-avatar"></div>
                <span class="username">Username</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <span class="page-title">Hello + Username!</span>
                </div>
                <div class="header-right">
                    <span class="search-icon">🔍</span>
                    <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Bus Illustration -->
                <svg class="bus-image" viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bus Body -->
                    <rect x="100" y="80" width="400" height="120" rx="25" fill="#1e3a8a"/>
                    <rect x="115" y="95" width="370" height="90" rx="20" fill="#2563eb"/>
                    
                    <!-- Windows -->
                    <rect x="140" y="115" width="70" height="50" rx="8" fill="#93c5fd"/>
                    <rect x="220" y="115" width="70" height="50" rx="8" fill="#93c5fd"/>
                    <rect x="300" y="115" width="70" height="50" rx="8" fill="#93c5fd"/>
                    <rect x="380" y="115" width="70" height="50" rx="8" fill="#93c5fd"/>
                    
                    <!-- Wheels -->
                    <circle cx="190" cy="200" r="28" fill="#1f2937"/>
                    <circle cx="190" cy="200" r="18" fill="#6b7280"/>
                    <circle cx="410" cy="200" r="28" fill="#1f2937"/>
                    <circle cx="410" cy="200" r="18" fill="#6b7280"/>
                    
                    <!-- Front Details -->
                    <rect x="475" y="120" width="20" height="40" rx="5" fill="#fbbf24"/>
                    <rect x="475" y="165" width="20" height="25" rx="5" fill="#ef4444"/>
                    
                    <!-- Grille Lines -->
                    <line x1="480" y1="130" x2="485" y2="130" stroke="#fff" stroke-width="2"/>
                    <line x1="480" y1="140" x2="485" y2="140" stroke="#fff" stroke-width="2"/>
                    <line x1="480" y1="150" x2="485" y2="150" stroke="#fff" stroke-width="2"/>
                </svg>

                <!-- Popular Routes Section -->
                <section class="routes-section">
                    <h3>Popular Routes</h3>
                    <div class="routes-grid">
                        <div class="route-card">
                            <div class="route-image"></div>
                            <h4>Cebu-Bato</h4>
                            <p class="price">₱300</p>
                            <p class="duration">5 hours</p>
                        </div>
                        <div class="route-card">
                            <div class="route-image"></div>
                            <h4>Cebu-Oslob</h4>
                            <p class="price">₱200</p>
                            <p class="duration">5 hours</p>
                        </div>
                        <div class="route-card">
                            <div class="route-image"></div>
                            <h4>Cebu-Boljoon</h4>
                            <p class="price">₱300</p>
                            <p class="duration">5 hours</p>
                        </div>
                        <div class="route-card">
                            <div class="route-image"></div>
                            <h4>Cebu-Dalaguete</h4>
                            <p class="price">₱300</p>
                            <p class="duration">5 hours</p>
                        </div>
                    </div>
                    
                    <div class="center-content" style="margin-top: 30px;">
                        <button class="btn-primary" onclick="window.location.href='search.html'">Book Now</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
