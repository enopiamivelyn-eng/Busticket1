<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Bus Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <img src="assets/images/mylogo.png" alt="Bus Ticketing Logo" style="width: 50px; height: 50px; object-fit: contain;">
                </div>
                <span class="logo-text">Bus Ticketing</span>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="home.html">Home</a></li>
                    <li class="nav-item"><a href="#about">About Us</a></li>
                    <li class="nav-item"><a href="my-bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a href="ticket.html">My Ticket</a></li>
                    <li class="nav-item"><a href="#profile">Profile</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="user-avatar"></div>
                <span class="username">Username</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="back-btn" onclick="window.history.back()">←</button>
                </div>
                <div class="header-right">
                    <span class="search-icon">🔍</span>
                    <button class="logout-btn" onclick="window.location.href='login.html'">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="card">
                    <h3 style="margin-bottom: 20px;">Book Details</h3>
                    
                    <div class="book-details">
                        <div class="bus-image-small"></div>
                        
                        <div class="booking-info">
                            <h3 id="busName">JoyBus</h3>
                            <div class="route-info">
                                <span id="busFrom">Cebu</span>
                                <span style="margin: 0 10px;">→</span>
                                <span id="busTo">Oslob</span>
                            </div>
                            <p id="busDateTime" style="margin-top: 5px;">September 5, 2026 | 8:00AM</p>
                            <p id="busSeat" style="margin-top: 5px;">Seat: 15</p>
                        </div>
                    </div>
                </div>

                <!-- Total Amount Section -->
                <div class="total-section">
                    <span>Total Amount</span>
                    <span id="totalAmount">₱200</span>
                </div>

                <!-- Payment Methods -->
                <div class="card">
                    <h3 style="margin-bottom: 20px;">Select Payment Method</h3>
                    
                    <form id="paymentForm" onsubmit="handlePayment(event)">
                        <div class="payment-methods">
                            <label class="payment-option">
                                <div class="payment-left">
                                    <div class="payment-icon">
                                        <svg width="30" height="30" viewBox="0 0 24 24" fill="#2563eb">
                                            <circle cx="12" cy="12" r="10"/>
                                            <text x="12" y="16" text-anchor="middle" fill="white" font-size="12" font-weight="bold">G</text>
                                        </svg>
                                    </div>
                                    <span style="font-size: 16px; font-weight: 500;">Gcash</span>
                                </div>
                                <input type="radio" name="paymentMethod" value="gcash" required>
                            </label>

                            <label class="payment-option">
                                <div class="payment-left">
                                    <div class="payment-icon" style="background-color: #1f2937;">
                                        <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
                                            <rect x="4" y="8" width="16" height="10" rx="2"/>
                                            <text x="12" y="15" text-anchor="middle" fill="white" font-size="10" font-weight="bold">M</text>
                                        </svg>
                                    </div>
                                    <span style="font-size: 16px; font-weight: 500;">Maya</span>
                                </div>
                                <input type="radio" name="paymentMethod" value="maya">
                            </label>
                        </div>

                        <div class="center-content" style="margin-top: 30px;">
                            <button type="submit" class="btn-primary" id="payButton">Pay ₱200</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Load booking data from sessionStorage
        window.addEventListener('DOMContentLoaded', function() {
            const bookingData = JSON.parse(sessionStorage.getItem('bookingData') || '{}');
            
            if (bookingData.busName) {
                document.getElementById('busName').textContent = bookingData.busName;
            }
            if (bookingData.from) {
                document.getElementById('busFrom').textContent = bookingData.from;
            }
            if (bookingData.to) {
                document.getElementById('busTo').textContent = bookingData.to;
            }
            if (bookingData.date && bookingData.time) {
                const dateObj = new Date(bookingData.date);
                const formattedDate = dateObj.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
                document.getElementById('busDateTime').textContent = `${formattedDate} | ${bookingData.time}`;
            }
            if (bookingData.seat) {
                document.getElementById('busSeat').textContent = `Seat: ${bookingData.seat}`;
            }
            if (bookingData.price) {
                document.getElementById('totalAmount').textContent = `₱${bookingData.price}`;
                document.getElementById('payButton').textContent = `Pay ₱${bookingData.price}`;
            }
        });

        function handlePayment(event) {
            event.preventDefault();
            
            const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked');
            
            if (!selectedMethod) {
                alert('Please select a payment method');
                return;
            }
            
            // Get existing booking data
            const bookingData = JSON.parse(sessionStorage.getItem('bookingData') || '{}');
            
            // Add payment info
            bookingData.paymentMethod = selectedMethod.value;
            bookingData.paymentDate = new Date().toISOString();
            
            // Save back to sessionStorage
            sessionStorage.setItem('bookingData', JSON.stringify(bookingData));
            
            // Simulate payment processing
            setTimeout(() => {
                // Redirect to confirmation page
                window.location.href = 'booking-confirmation.html';
            }, 1000);
        }
    </script>
</body>
</html>
