<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bus Ticketing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Logo and Illustration -->
        <div class="login-left">
            <div class="login-logo">
                <div class="logo-container">
                    <div class="logo">
                        <img src="assets/images/mylogo.png" alt="Bus Ticketing Logo" style="width: 50px; height: 50px; object-fit: contain;">
                    </div>
                    <span class="logo-text">Bus Ticketing</span>
                </div>
            </div>
            
            <svg class="bus-illustration" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Bus Body -->
                <rect x="50" y="60" width="300" height="100" rx="20" fill="#1e3a8a"/>
                <rect x="60" y="70" width="280" height="80" rx="15" fill="#2563eb"/>
                
                <!-- Windows -->
                <rect x="80" y="85" width="50" height="40" rx="5" fill="#93c5fd"/>
                <rect x="140" y="85" width="50" height="40" rx="5" fill="#93c5fd"/>
                <rect x="200" y="85" width="50" height="40" rx="5" fill="#93c5fd"/>
                <rect x="260" y="85" width="50" height="40" rx="5" fill="#93c5fd"/>
                
                <!-- Wheels -->
                <circle cx="120" cy="160" r="20" fill="#1f2937"/>
                <circle cx="120" cy="160" r="12" fill="#6b7280"/>
                <circle cx="280" cy="160" r="20" fill="#1f2937"/>
                <circle cx="280" cy="160" r="12" fill="#6b7280"/>
                
                <!-- Front Details -->
                <rect x="330" y="90" width="15" height="30" rx="3" fill="#fbbf24"/>
                <rect x="330" cy="130" width="15" height="20" rx="3" fill="#ef4444"/>
            </svg>
        </div>

        <!-- Right Side - Login Form -->
        <div class="login-right">
            <div class="login-form">
                <h2>Welcome!</h2>
                <p>Sign in to continue</p>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password</a>
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%;">Sign in</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simple validation - In production, use proper authentication
            if (email && password) {
                // Check if admin login
                if (email.includes('admin')) {
                    window.location.href = 'admin-buses.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }
    </script>
</body>
</html>
